<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c858e" />
      <stop offset="50%" stop-color="#187a82" />
      <stop offset="100%" stop-color="#136971" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a3e43" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="64" fill="url(#tealGrad)" />

  <!-- Corner Decorative Cloud / Floral Silhouettes (Matching the original logo corners) -->
  <!-- Top Right -->
  <g fill="#278e97" opacity="0.45">
    <circle cx="480" cy="32" r="44" />
    <circle cx="512" cy="70" r="38" />
    <circle cx="440" cy="16" r="30" />
    <circle cx="495" cy="5" r="28" />
  </g>
  <!-- Top Left -->
  <g fill="#278e97" opacity="0.45">
    <circle cx="28" cy="36" r="40" />
    <circle cx="68" cy="18" r="32" />
    <circle cx="5" cy="75" r="34" />
  </g>
  <!-- Bottom Left -->
  <g fill="#278e97" opacity="0.4">
    <circle cx="20" cy="485" r="42" />
    <circle cx="65" cy="495" r="32" />
    <circle cx="10" cy="445" r="30" />
  </g>
  <!-- Bottom Right -->
  <g fill="#278e97" opacity="0.4">
    <circle cx="490" cy="480" r="42" />
    <circle cx="450" cy="500" r="34" />
    <circle cx="505" cy="435" r="30" />
  </g>

  <!-- Central Logo Content -->
  <g filter="url(#softGlow)">
    <!-- Main Calligraphy / Typography in Pure White -->
    <!-- "المسلم" -->
    <text
      x="256"
      y="240"
      text-anchor="middle"
      fill="#ffffff"
      font-family="'Readex Pro', 'IBM Plex Sans Arabic', 'Tajawal', sans-serif"
      font-weight="900"
      font-size="108"
      letter-spacing="-1px"
      style="user-select: none;"
    >المسلم</text>

    <!-- "الصغير" -->
    <text
      x="256"
      y="348"
      text-anchor="middle"
      fill="#ffffff"
      font-family="'Readex Pro', 'IBM Plex Sans Arabic', 'Tajawal', sans-serif"
      font-weight="900"
      font-size="104"
      letter-spacing="-1px"
      style="user-select: none;"
    >الصغير</text>

    <!-- Distinctive Dots for the letter (ياء) in الصغير -->
    <!-- Two circles positioned below the word like in the original logo -->
    <circle cx="218" cy="382" r="10" fill="#ffffff" />
    <circle cx="244" cy="382" r="10" fill="#ffffff" />

    <!-- English Subtitle: "The Muslim Kid" -->
    <text
      x="256"
      y="418"
      text-anchor="middle"
      fill="#ffffff"
      font-family="'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif"
      font-weight="700"
      font-size="24"
      letter-spacing="2.5px"
      style="user-select: none;"
    >The Muslim Kid</text>
  </g>
</svg>
